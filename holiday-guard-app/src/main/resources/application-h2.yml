spring:
  datasource:
    url: jdbc:h2:file:./holiday-guard-data;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns the schema; Hibernate only validates it
    show-sql: false
  flyway:
    # Migrations live in vendor subfolders (see application-postgres.yml) so that
    # Flyway's recursive classpath scan never sees more than one vendor's V1 script.
    locations: classpath:db/migration/h2
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080  # Fixed port for H2 profile (local development)
